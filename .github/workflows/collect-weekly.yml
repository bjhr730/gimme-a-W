name: Collect weekly (rosters and history)

on:
  schedule:
    # Tuesdays 06:30 UTC, after the NFL week closes.
    - cron: "30 6 * * 2"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug or 'all' (rosters)"
        default: "all"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Rosters for every team (ESPN)
        run: |
          uv run gimme-collect run espn --kind roster \
            --league "${{ github.event.inputs.league || 'all' }}"
      - name: Current NFL season from nflverse (games, closing lines, player weeks)
        if: always()
        run: uv run gimme-collect run nflverse --seasons current --what games,players
      - name: Current soccer seasons from football-data.co.uk (shots, corners, closing odds)
        if: always()
        run: uv run gimme-collect run fdcouk --league all --seasons current
      - name: Recompute team form and Elo ratings
        if: always()
        run: uv run gimme-collect derive --what form,elo
      - name: Back-test the models against the closing line
        if: always()
        run: uv run gimme-predict backtest
