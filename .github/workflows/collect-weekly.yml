name: Collect weekly (rosters and history)

on:
  schedule:
    # Tuesdays 06:30 UTC, after the NFL week closes.
    - cron: "30 6 * * 2"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug or 'all' (rosters)"
        default: "all"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    # This was being killed at 90 minutes -- the last run hit 95 and was
    # cancelled mid-flight. Nearly all of it was ESPN rosters for nineteen soccer
    # competitions, which no longer happens: rosters are the NFL and college
    # football only now. If 60 is not enough, the right answer is to find out
    # why rather than to raise it again.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      # ESPN is American football only now, so this is two competitions.
      - name: Rosters for every team (ESPN)
        run: |
          uv run gimme-collect run espn --kind roster \
            --league "${{ github.event.inputs.league || 'all' }}"
      - name: Current NFL season from nflverse (games, closing lines, player weeks)
        if: always()
        run: uv run gimme-collect run nflverse --seasons current --what games,players
      # The current season is collected daily now, alongside the cross-check.
      # What is left for the weekly pass is the archive: seasons that have ended
      # do not change, but a re-read repairs anything a failed run left behind.
      - name: Recent soccer seasons from football-data.co.uk (shots, corners, closing odds)
        if: always()
        run: uv run gimme-collect run fdcouk --league all --seasons 2023-2026
      - name: Recompute team form and Elo ratings
        if: always()
        run: uv run gimme-collect derive --what form,elo
      - name: Back-test the models against the closing line
        if: always()
        run: uv run gimme-predict backtest
