name: Collect rosters (ESPN)

on:
  schedule:
    # Tuesdays 06:30 UTC, after the NFL week closes.
    - cron: "30 6 * * 2"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug or 'all'"
        default: "all"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Collect every team's roster
        run: |
          uv run gimme-collect run espn --kind roster \
            --league "${{ github.event.inputs.league || 'all' }}"
