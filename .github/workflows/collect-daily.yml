name: Collect (ESPN)

on:
  schedule:
    # Four times a day, UTC. Covers European afternoons and US evenings.
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug (nfl, college-football, eng.1, ...) or 'all'"
        default: "all"
      date:
        description: "Date YYYY-MM-DD or 'today'"
        default: "today"
      days:
        description: "Number of days starting at date"
        default: "2"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Collect, derive and predict across 21 competitions with a full season of
    # lineups behind them. The old 45 minutes was set when there was far less data.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Collect scoreboard, teams, standings, injuries and game summaries
        run: |
          uv run gimme-collect run espn \
            --kind all \
            --league "${{ github.event.inputs.league || 'all' }}" \
            --date "${{ github.event.inputs.date || 'yesterday' }}" \
            --days "${{ github.event.inputs.days || '3' }}"
      - name: Fixtures for the next ten days
        if: always()
        run: uv run gimme-collect run espn --kind scoreboard --league all --date today --days 10
      # A missed or failed run used to leave a hole in the season that nothing
      # filled in later. Re-reading the last three weeks closes any gap. Once a
      # day is enough. Since ESPN dropped range requests this is a day at a time,
      # so it is slower than it was -- but past days cache, so a repeat is cheap.
      - name: Re-read the last three weeks so a missed run cannot leave a gap
        if: always()
        run: |
          if [ "$(date -u +%H)" = "05" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            uv run gimme-collect run espn --kind scoreboard --league all --date "$(date -u -d '21 days ago' +%F)" --days 22
          else
            echo "Skipped: the three-week re-read runs on the 05:15 UTC pass."
          fi
      # College football is the one competition ESPN served alone, and the results
      # showed it. CFBD is its nflverse: documented, keyed, and authoritative on
      # scores. Games land on the rows ESPN already created (name-matched teams,
      # kickoff within 36 hours), so this adds results and lines rather than
      # duplicates. Skipped silently until the free key is in the repo secrets.
      - name: College football games and betting lines from CollegeFootballData
        if: always() && env.CFBD_API_KEY != ''
        run: uv run gimme-collect run cfbd --seasons current --what games,lines
      # The NFL injury report moves Wednesday to Friday, so the Tuesday nflverse
      # run is stale by kickoff. This is the league's own report -- designation
      # plus practice participation, which the ESPN injuries page does not carry --
      # and it is one small CSV, so it can run with the rest.
      - name: NFL injury report from nflverse
        if: always()
        run: uv run gimme-collect run nflverse --seasons current --what injuries
      - name: Recompute team form and Elo ratings
        if: always()
        run: uv run gimme-collect derive --what form,elo
      - name: Predict games in the coming eight days
        if: always()
        run: uv run gimme-predict run --days 8
      - name: Grade published predictions against results (last 30 days)
        if: always()
        run: uv run gimme-predict score --days 30
      # Each pass writes a complete fresh set of predictions. Without this the old
      # ones accumulated at about 70 MB a day and refilled the 512 MB project.
      - name: Drop predictions a newer run has superseded
        if: always()
        run: uv run gimme-predict prune
      - name: Health check (fails the run, and emails you, when data stops flowing)
        if: always()
        run: uv run gimme-collect health
