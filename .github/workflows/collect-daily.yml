name: Collect (ESPN)

on:
  schedule:
    # Four times a day, UTC. Covers European afternoons and US evenings.
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "League slug (nfl, college-football, eng.1, ...) or 'all'"
        default: "all"
      date:
        description: "Date YYYY-MM-DD or 'today'"
        default: "today"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Collect scoreboard, teams and standings
        run: |
          uv run gimme-collect run espn \
            --kind all \
            --league "${{ github.event.inputs.league || 'all' }}" \
            --date "${{ github.event.inputs.date || 'today' }}" \
            --days 2
