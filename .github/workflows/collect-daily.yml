name: Collect

on:
  schedule:
    # Two schedules, not one. Scores need collecting through the day; nothing
    # else does. Re-deriving Elo, refitting every model and regrading the last
    # thirty days four times over produced the same answer four times and read
    # about 18 MB of the monthly transfer allowance each time.
    - cron: "15 5 * * *" # the full pass: collect, derive, predict, grade
    - cron: "15 11,17,23 * * *" # collection only
  workflow_dispatch:
    inputs:
      league:
        description: "League slug (nfl, college-football, eng.1, ...) or 'all'"
        default: "all"
      date:
        description: "Date YYYY-MM-DD or 'today'"
        default: "today"
      days:
        description: "Number of days starting at date"
        default: "2"

concurrency:
  group: collect-espn
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Collect, derive and predict across the active competitions. The ceiling is
    # a budget, not an estimate: on a private repo Actions minutes are metered,
    # and a run that hangs should cost an hour rather than two. Observed p90 was
    # 53 minutes when ESPN served nineteen soccer competitions; it now serves
    # none of them.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      # Everything except the collection-only schedule is a full pass, so a
      # manual run does the lot.
      FULL_PASS: ${{ github.event.schedule != '15 11,17,23 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: NFL and college football from ESPN (scores, teams, standings, injuries)
        run: |
          uv run gimme-collect run espn \
            --kind all \
            --league "${{ github.event.inputs.league || 'all' }}" \
            --date "${{ github.event.inputs.date || 'yesterday' }}" \
            --days "${{ github.event.inputs.days || '3' }}"
      # Soccer, from a documented API under a licence. One request per
      # competition returns the whole season -- every fixture and every result --
      # so nine competitions cost nine calls for matches and nine for tables,
      # inside the free tier's ten a minute. ESPN served none of this legitimately
      # and, in one month, broke twice without saying so.
      - name: Soccer fixtures and results from football-data.org
        if: always() && env.FOOTBALL_DATA_API_KEY != ''
        run: uv run gimme-collect run football-data --league all --kind scoreboard --seasons current
      # Tables only move when matches finish, and the matches above already
      # carry the results, so once a day is enough for the standing rows.
      - name: Soccer tables from football-data.org
        if: always() && env.FULL_PASS == 'true' && env.FOOTBALL_DATA_API_KEY != ''
        run: uv run gimme-collect run football-data --league all --kind standings --seasons current
      - name: Football fixtures for the next ten days
        if: always()
        run: uv run gimme-collect run espn --kind scoreboard --league all --date today --days 10
      # A missed or failed run used to leave a hole in the season that nothing
      # filled in later. Re-reading the last three weeks closes any gap. Once a
      # day is enough. Since ESPN dropped range requests, football is fetched a
      # day at a time and soccer a month at a time -- so three weeks of soccer is
      # one or two requests per league, not twenty-two.
      - name: Re-read football's last three weeks so a missed run cannot leave a gap
        if: always() && env.FULL_PASS == 'true'
        run: >-
          uv run gimme-collect run espn --kind scoreboard --league all
          --date "$(date -u -d '21 days ago' +%F)" --days 22
      # College football is the one competition ESPN served alone, and the results
      # showed it. CFBD is its nflverse: documented, keyed, and authoritative on
      # scores. Games land on the rows ESPN already created (name-matched teams,
      # kickoff within 36 hours), so this adds results and lines rather than
      # duplicates. Skipped silently until the free key is in the repo secrets.
      - name: College football games and betting lines from CollegeFootballData
        if: always() && env.FULL_PASS == 'true' && env.CFBD_API_KEY != ''
        run: uv run gimme-collect run cfbd --seasons current --what games,lines
      # The NFL injury report moves Wednesday to Friday, so the Tuesday nflverse
      # run is stale by kickoff. This is the league's own report -- designation
      # plus practice participation, which the ESPN injuries page does not carry --
      # and it is one small CSV, so it can run with the rest.
      - name: NFL injury report from nflverse
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-collect run nflverse --seasons current --what injuries
      # The second witness. football-data.co.uk publishes the same results as
      # static CSVs from an unrelated operation, and it is also where shots,
      # corners and closing odds come from now that ESPN is gone.
      #
      # The comparison runs BEFORE the collection, not after. Writing those rows
      # first would fill in every result the primary source missed and then report
      # a clean check -- the repair would hide the fault it was meant to expose.
      - name: Cross-check soccer results against football-data.co.uk
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-collect crosscheck --league all --days 14
      - name: Soccer results and closing odds from football-data.co.uk
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-collect run fdcouk --league all --seasons current
      # Keeps competition.is_active pointing at what is actually collected, so a
      # league switched off in the source lists leaves the site too instead of
      # showing fixtures nothing will ever resolve.
      - name: Mark retired competitions
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-collect competitions
      - name: Recompute team form and Elo ratings
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-collect derive --what form,elo
      - name: Predict games in the coming eight days
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-predict run --days 8
      - name: Grade published predictions against results (last 30 days)
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-predict score --days 30
      # Each pass writes a complete fresh set of predictions. Without this the old
      # ones accumulated at about 70 MB a day and refilled the 512 MB project.
      - name: Drop predictions a newer run has superseded
        if: always() && env.FULL_PASS == 'true'
        run: uv run gimme-predict prune
      - name: Health check (fails the run, and emails you, when data stops flowing)
        if: always()
        run: uv run gimme-collect health
