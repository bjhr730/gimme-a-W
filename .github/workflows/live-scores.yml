name: Live scores

# The full collection runs four times a day, which leaves a match played between
# passes frozen at its pre-kickoff state: a tie that kicked off at 16:45 still
# read 0-0 with no clock at 18:16. This job refreshes scores only, and only for
# competitions with a ball actually in play.
#
# `gimme-collect live` asks the database what is on before touching the network
# and exits in seconds when nothing is, so a quiet run costs almost nothing and a
# busy one costs a couple of range requests. The repository is public, so Actions
# minutes are unlimited and the schedule can follow the games rather than a budget.

on:
  schedule:
    # Every five minutes, which is as often as GitHub schedules anything, across
    # the hours these competitions actually play: European afternoons and evenings,
    # then the Americas through the night. Only 05:00-09:00 UTC is left out, the
    # one window with no kickoffs at all in the last 120 days, since a run in a
    # dead hour still costs a checkout to discover there is nothing to do.
    - cron: "*/5 0-4,10-23 * * *"
  workflow_dispatch:

concurrency:
  group: live-scores
  cancel-in-progress: true

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collectors
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: ${{ vars.COLLECTOR_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Refresh scores for whatever is in play
        run: uv run gimme-collect live
